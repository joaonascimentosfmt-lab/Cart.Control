  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="icons/icon.svg" alt="CartoMetrics" class="brand-icon">
        <span class="brand-name">CartoMetrics</span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="side-link" href="#/dashboard" data-route="dashboard"><svg class="nav-icon" aria-hidden="true"><use href="#i-grid" xlink:href="#i-grid"></use></svg><span>Dashboard</span></a>
        <a class="side-link" href="#/protocols" data-route="protocols"><svg class="nav-icon" aria-hidden="true"><use href="#i-folder" xlink:href="#i-folder"></use></svg><span>Protocolos</span></a>
        <a class="side-link" href="#/agenda" data-route="agenda"><svg class="nav-icon" aria-hidden="true"><use href="#i-calendar" xlink:href="#i-calendar"></use></svg><span>Agenda</span></a>
        <a class="side-link" href="#/emails" data-route="emails"><svg class="nav-icon" aria-hidden="true"><use href="#i-mail" xlink:href="#i-mail"></use></svg><span>E-mails</span></a>
        <a class="side-link" href="#/tasks" data-route="tasks"><svg class="nav-icon" aria-hidden="true"><use href="#i-check-square" xlink:href="#i-check-square"></use></svg><span>Tarefas</span></a>
        <a class="side-link" href="#/clients" data-route="clients"><svg class="nav-icon" aria-hidden="true"><use href="#i-users" xlink:href="#i-users"></use></svg><span>Clientes</span></a>
        <a class="side-link" href="#/reports" data-route="reports"><svg class="nav-icon" aria-hidden="true"><use href="#i-chart" xlink:href="#i-chart"></use></svg><span>Relatórios</span></a>
        <span class="side-sep">Gestão</span>
        <a class="side-link" href="#/staff" data-route="staff"><svg class="nav-icon" aria-hidden="true"><use href="#i-user" xlink:href="#i-user"></use></svg><span>Funcionários</span></a>
        <a class="side-link" href="#/audit" data-route="audit"><svg class="nav-icon" aria-hidden="true"><use href="#i-shield" xlink:href="#i-shield"></use></svg><span>Auditoria</span></a>
        <a class="side-link" href="#/settings" data-route="settings"><svg class="nav-icon" aria-hidden="true"><use href="#i-settings" xlink:href="#i-settings"></use></svg><span>Configurações</span></a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="search-wrap">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-search" xlink:href="#i-search"></use></svg>
          <input type="search" id="global-search" placeholder="Buscar protocolo, cliente, CPF/CNPJ, e-mail..." aria-label="Busca global">
        </div>
        <div class="topbar-actions">
          <button class="topbar-btn" id="bell-btn" title="Notificações" aria-label="Notificações">
            <svg class="nav-icon" aria-hidden="true"><use href="#i-bell" xlink:href="#i-bell"></use></svg>
            <span class="notif-count" id="notif-count" hidden></span>
          </button>
        <div class="user-chip" id="user-chip">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-user" xlink:href="#i-user"></use></svg>
          <span id="user-name">—</span>
        </div>
        <button class="topbar-btn" id="logout-btn" title="Sair" aria-label="Sair">
          <svg class="nav-icon" aria-hidden="true"><use href="#i-logout" xlink:href="#i-logout"></use></svg>
        </button>
      </div>
      </header>

      <div class="notif-panel" id="notif-panel" hidden></div>
      <div class="search-results" id="search-results" hidden></div>

      <main id="view" class="view" aria-live="polite"></main>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/dashboard.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/clients.js"></script>
  <script src="js/emails.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/audit.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
