<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a3a5c">
  <meta name="description" content="Controle.Cart — Agenda, protocolos e monitoramento de e-mails do cartório.">
  <title>Controle.Cart</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon.svg" alt="Controle.Cart" class="brand-icon">
      <h1>Controle.Cart</h1>
    </div>
    <button id="offline-badge" class="offline-badge" hidden>Offline</button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="bottom-nav">
    <button class="nav-item is-active" data-route="agenda">
      <span class="nav-icon" aria-hidden="true">&#128197;</span>
      <span>Agenda</span>
    </button>
    <button class="nav-item" data-route="planilha">
      <span class="nav-icon" aria-hidden="true">&#128203;</span>
      <span>Planilha</span>
    </button>
    <button class="nav-item" data-route="email">
      <span class="nav-icon" aria-hidden="true">&#9993;</span>
      <span>E-mails</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
